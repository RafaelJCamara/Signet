name: Publish images

# Separate from CI for the same reason `Release CLI` is: this workflow needs write access to
# the package registry, and CI must not have it. CI still *builds* both images and smoke-tests
# the CLI one — what it cannot do is push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish alongside the commit SHA, for example 0.1.0'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Not fail-fast: if the API image fails to build, knowing whether the CLI did too is
      # the difference between a shared problem and a specific one.
      fail-fast: false
      matrix:
        include:
          - image: concordat-api
            dockerfile: docker/api.Dockerfile
          - image: concordat-cli
            dockerfile: docker/cli.Dockerfile

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by the runner from the `packages: write` permission above. No stored
          # secret to rotate, and it cannot be used from a fork.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the owner: GHCR rejects an upper-case path, and `github.repository_owner`
      # preserves whatever case the account was registered with.
      - name: Work out the image name
        id: name
        run: echo "value=${REGISTRY}/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}

      - name: Tags
        id: tags
        run: |
          # `latest` and any release tag are promoted only after the smoke test below passes
          # (see "Promote to latest" at the end of this job) — pushed here, they would be
          # live and pullable the moment `docker/build-push-action` finishes, before anything
          # has run the image at all. The SHA tag is what this step pushes directly: it is
          # the one deployments should pin regardless, and staying unpromoted-until-verified
          # doesn't apply to it the same way, since nothing follows it implicitly.
          PROMOTE="latest"

          if [ -n "${EXTRA}" ]; then
            PROMOTE="${PROMOTE},${EXTRA}"
          fi

          # A tag push names the release, and that is the tag people will actually pin.
          case "${GITHUB_REF}" in
            refs/tags/v*) PROMOTE="${PROMOTE},${GITHUB_REF#refs/tags/v}" ;;
          esac

          {
            echo "sha-tag=${NAME}:${GITHUB_SHA}"
            echo "promote=${PROMOTE}"
          } >> "$GITHUB_OUTPUT"
        env:
          NAME: ${{ steps.name.outputs.value }}
          EXTRA: ${{ inputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.sha-tag }}
          # Container Apps runs amd64. arm64 is here for Apple Silicon developers running the
          # compose `registry` profile, who would otherwise emulate and wonder why it crawls.
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      # The API image is never exercised by CI, unlike the CLI's, so this is the only place
      # that finds out whether what was just published can start at all. It is a 30-second
      # check against a real database, and the alternative is discovering it in a deployment.
      #
      # Runs against the SHA tag specifically, before anything else can be pulled under
      # `latest` — see "Promote to latest" below.
      - name: The published API image starts and answers
        if: matrix.image == 'concordat-api'
        run: |
          docker network create concordat-check

          docker run -d --name pg --network concordat-check \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=concordat \
            postgres:17-alpine

          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d concordat && break
            sleep 2
          done

          CS='Host=pg;Database=concordat;Username=postgres;Password=postgres'

          docker run --rm --network concordat-check \
            -e ConnectionStrings__Concordat="$CS" \
            --entrypoint dotnet "${SHA_TAG}" Concordat.Migrator.dll

          docker run -d --name api --network concordat-check \
            -e ConnectionStrings__Concordat="$CS" -p 8080:8080 "${SHA_TAG}"

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then
              echo "the published image serves /health/ready"
              exit 0
            fi
            sleep 2
          done

          echo "::error::the published image never became ready"
          docker logs api
          exit 1
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha-tag }}

      # CI's own `cli-container` job runs these same checks against a locally-built image on
      # every push; repeated here against what was actually just pushed, in case the registry
      # round-trip itself (layer upload, manifest, GHCR's handling of a NativeAOT binary) is
      # what breaks — which a check that only ever ran against a local build could not catch.
      - name: The published CLI image runs and carries no .NET runtime
        if: matrix.image == 'concordat-cli'
        run: |
          if docker run --rm --entrypoint sh "${SHA_TAG}" \
               -c 'command -v dotnet || ls /usr/share/dotnet' 2>/dev/null; then
            echo "::error::a .NET runtime is present in the published CLI image"
            exit 1
          fi

          mkdir -p ws/contracts
          echo '{"type":"object","properties":{"id":{"type":"integer"}}}' > ws/contracts/acme.Order.json

          OUT=$(docker run --rm -v "$PWD/ws:/workspace" "${SHA_TAG}" lint --json)
          echo "$OUT"
          echo "$OUT" | grep -q '"schemaId"' || { echo "::error::--json lost its payload"; exit 1; }
        env:
          SHA_TAG: ${{ steps.tags.outputs.sha-tag }}

      # Only reached if the smoke test for this image passed — a skipped step (the other
      # image's) counts as success for this purpose, so this still runs once per image. Copies
      # the manifest the smoke test just verified under each promoted tag rather than
      # rebuilding, so `latest` and any release tag point at the exact bytes that were tested,
      # not a second build of the same source that could differ (a base image digest moving
      # between the two runs, a flaky layer, anything nondeterministic in the build itself).
      - name: Promote to latest
        run: |
          IFS=',' read -ra TAGS <<< "${PROMOTE}"
          ARGS=()
          for tag in "${TAGS[@]}"; do
            ARGS+=(--tag "${NAME}:${tag}")
          done
          docker buildx imagetools create "${ARGS[@]}" "${SHA_TAG}"
        env:
          NAME: ${{ steps.name.outputs.value }}
          SHA_TAG: ${{ steps.tags.outputs.sha-tag }}
          PROMOTE: ${{ steps.tags.outputs.promote }}
