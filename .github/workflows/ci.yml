name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only reads the repo. Anything needing write gets its own workflow.
permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Keyed on the one file that owns every package version (central package
      # management), so the cache invalidates exactly when dependencies change.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Concordat.slnx

      # Before build: a formatting failure should be reported in seconds, not after
      # a full compile.
      - name: Verify formatting
        run: dotnet format Concordat.slnx --verify-no-changes --no-restore

      # Directory.Build.props sets TreatWarningsAsErrors, and ContinuousIntegrationBuild
      # switches on automatically here via GITHUB_ACTIONS.
      - name: Build
        run: dotnet build Concordat.slnx --configuration Release --no-restore

      # The build regenerates docs/api/openapi.v1.json. If it differs from what is committed,
      # the published protocol no longer matches the code, and every generated client is
      # working from a stale spec (ADR-019).
      - name: Verify the committed OpenAPI document is current
        run: |
          if ! git diff --exit-code -- docs/api/openapi.v1.json; then
            echo "::error::docs/api/openapi.v1.json is stale. Run 'dotnet build' and commit the result."
            exit 1
          fi

      - name: Test
        run: >
          dotnet test Concordat.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      # A red Test step whose only annotation is "Process completed with exit code 1" cannot be
      # acted on without opening the log, and the log is not readable to everyone who can see the
      # run is red. The TRX files already carry the failing test names and their messages, so
      # they are promoted to annotations, which appear on the run summary itself. Same reasoning
      # as the e2e job's log upload: a failure nobody can read is a failure nobody can fix.
      - name: Report the failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          NS = '{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}'
          trx = sorted(glob.glob('TestResults/**/*.trx', recursive=True))
          print(f'{len(trx)} TRX file(s): {[os.path.basename(p) for p in trx]}')

          def one_line(text, limit=700):
              flat = ' '.join((text or '').split())
              return flat[:limit]

          total = 0
          for path in trx:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  print(f'::warning::{path} is not parseable: {exc}')
                  continue

              for result in root.iter(f'{NS}UnitTestResult'):
                  if result.get('outcome') != 'Failed':
                      continue
                  total += 1
                  if total > 25:
                      continue
                  name = result.get('testName', '(unnamed)')
                  message = one_line(''.join(
                      node.text or '' for node in result.iter(f'{NS}Message')))
                  stack = one_line(''.join(
                      node.text or '' for node in result.iter(f'{NS}StackTrace')), 400)
                  print(f'::error::FAILED {name} :: {message} :: {stack}')

          # A project that dies before running a test writes no results at all, so the count of
          # failures alone would report "0 failed" on a red step.
          for run_info in (node for path in trx
                           for node in ET.parse(path).getroot().iter(f'{NS}RunInfo')):
              print(f'::error::RUN ERROR {one_line("".join(run_info.itertext()))}')

          print(f'::error::{total} failed test(s) across {len(trx)} result file(s)')
          PY

      # Non-blocking for now (M0.3). There is nothing worth measuring until the
      # compatibility engine lands in M1.3; wiring an external service before then
      # just adds a token to rotate.
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: web app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The Angular app had no CI job at all until M6.1, which meant its own drift gate --
    # concordatCode generated from ConcordatCodes.cs -- worked locally and was decorative
    # here. A gate nobody runs is a gate that has already failed.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The floor the Angular 22 CLI enforces. Declared in web/package.json engines too,
          # so a local mismatch fails loudly rather than mysteriously.
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # Before the build: the catalogue drifting is a protocol defect, and it is the cheapest
      # thing here to check.
      - name: The concordatCode union matches the domain catalogue
        working-directory: web
        run: npm run codes:check

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Formatting
        working-directory: web
        run: npm run format:check

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  e2e:
    name: browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Its own job, and it needs the whole product: the API image, PostgreSQL, and the dev
    # server. That is the point -- the first browser to load this app against a running
    # registry found the subject list broken, with every unit test on both sides green.
    #
    # Separate from `web` so a lint failure is not reported as an E2E failure, and so the
    # fast job still answers in two minutes.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: concordat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ConnectionStrings__Concordat: 'Host=localhost;Database=concordat;Username=postgres;Password=postgres'
      CONCORDAT_WEB_URL: http://localhost:4300
      CONCORDAT_REGISTRY: http://localhost:5062

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # From source rather than the published image: this job's purpose is to catch the two
      # halves disagreeing, and testing yesterday's image against today's frontend would let
      # exactly that disagreement through.
      #
      # Built as its own step so that a compile error is reported as a compile error. Building
      # inside the background step below would swallow it and surface it two minutes later as
      # "the registry never became ready", which is true and useless.
      - name: Build the hosts
        run: |
          dotnet build src/hosts/Concordat.Api -c Release
          dotnet build src/hosts/Concordat.Migrator -c Release

      - name: Migrate
        run: dotnet run --project src/hosts/Concordat.Migrator -c Release --no-build

      # Both servers log to a file that is uploaded on failure. A backgrounded process whose
      # output goes nowhere leaves a red run with nothing in it to read.
      - name: Start the registry
        run: |
          dotnet run --project src/hosts/Concordat.Api -c Release --no-build \
            --urls http://localhost:5062 >"$RUNNER_TEMP/registry.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:5062/health/ready >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::the registry never became ready"
          tail -n 50 "$RUNNER_TEMP/registry.log" || true
          exit 1

      - name: Start the web app
        working-directory: web
        run: |
          npm start -- --port 4300 >"$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4300 >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::the dev server never came up"
          tail -n 50 "$RUNNER_TEMP/web.log" || true
          exit 1

      - name: End-to-end
        working-directory: web
        run: npm run e2e

      - name: Upload the trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
            ${{ runner.temp }}/registry.log
            ${{ runner.temp }}/web.log
          retention-days: 7

  protocol-docs:
    name: protocol docs gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # ADR-019 makes the concordatCode catalogue normative and its acceptance test is that a
    # client can be written without reading any C#. The published catalogue is generated from
    # the source for that reason, so it needs the same treatment as the OpenAPI document: a
    # generated artifact nobody compares to its source is one that is already out of date.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: The published catalogue matches ConcordatCodes.cs
        run: node scripts/generate-protocol-docs.mjs --check

  contract-drift:
    name: contract drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # M3's exit criterion, asserted rather than assumed. The generator's own tests drive it
    # through CSharpGeneratorDriver; this proves the MSBuild wiring — the props file, the
    # AdditionalFiles glob, analyzer delivery — which those tests bypass entirely.
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: The sample builds while its contract matches
        run: dotnet build samples/ContractDrift --nologo

      - name: Breaking the record must fail the build
        run: |
          set +e
          cp samples/ContractDrift/OrderCreated.cs /tmp/OrderCreated.cs.bak
          sed -i 's/string? Note/string Note/' samples/ContractDrift/OrderCreated.cs

          OUT=$(dotnet build samples/ContractDrift --nologo 2>&1)
          STATUS=$?
          cp /tmp/OrderCreated.cs.bak samples/ContractDrift/OrderCreated.cs

          echo "$OUT" | grep -F 'CDT003' || true

          if [ $STATUS -eq 0 ]; then
            echo "::error::a breaking change to the record did not fail the build"
            exit 1
          fi

          echo "$OUT" | grep -qF '#/properties/note/type' || {
            echo "::error::CDT003 fired but did not name the offending path"
            exit 1
          }

  cli-container:
    name: CLI container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Separate from build & test because it verifies something the test suite cannot:
    # that the CLI survives NativeAOT. Trimming failures do not show up in a JIT build —
    # a reflection-based serialiser compiles and tests green, then emits empty objects
    # in the published binary. The only way to catch that is to publish and run it.
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f docker/cli.Dockerfile -t concordat/cli:ci .

      # The API image is built here too, and only built. Publishing needs write access to the
      # registry, which CI deliberately does not have — that is `Publish images`. What this
      # catches is the failure mode that produced this job: an image that cannot be built at
      # all, which nothing else notices because every other check runs on the host.
      #
      # It is also the check that the container build reproduces the repository's build rules.
      # It does not, unless .editorconfig is copied in: TreatWarningsAsErrors is on, and
      # without .editorconfig every analyser applies its DEFAULT severity, so the image fails
      # on rules the repository has deliberately relaxed and does so nowhere else.
      - name: Build the API image
        run: docker build -f docker/api.Dockerfile -t concordat/api:ci .

      - name: The API image runs the migrator and the registry from one build
        run: |
          docker network create ci-check
          docker run -d --name ci-pg --network ci-check             -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=concordat             postgres:17-alpine

          for _ in $(seq 1 30); do
            docker exec ci-pg pg_isready -U postgres -d concordat && break
            sleep 2
          done

          CS='Host=ci-pg;Database=concordat;Username=postgres;Password=postgres'

          # Same image, different entrypoint. A migrator shipped separately could be built
          # from another commit, and the mismatch would not surface until a request touched
          # the changed table.
          docker run --rm --network ci-check -e ConnectionStrings__Concordat="$CS"             --entrypoint dotnet concordat/api:ci Concordat.Migrator.dll

          docker run -d --name ci-api --network ci-check             -e ConnectionStrings__Concordat="$CS" -p 8080:8080 concordat/api:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then
              echo "the image serves /health/ready"
              exit 0
            fi
            sleep 2
          done

          echo "::error::the API image never became ready"
          docker logs ci-api
          exit 1

      - name: The image must carry no .NET runtime
        run: |
          if docker run --rm --entrypoint sh concordat/cli:ci \
               -c 'command -v dotnet || ls /usr/share/dotnet' 2>/dev/null; then
            echo "::error::a .NET runtime is present in the CLI image"
            exit 1
          fi

      - name: The AOT binary must actually work
        run: |
          set +e
          mkdir -p ws/contracts
          echo '{"type":"object","properties":{"id":{"type":"integer"}}}' > ws/contracts/acme.Order.json

          # --json under AOT is the assertion that matters: reflection-based serialisation
          # compiles and tests fine, then silently emits {} once trimmed.
          OUT=$(docker run --rm -v "$PWD/ws:/workspace" concordat/cli:ci lint --json)
          echo "$OUT"
          echo "$OUT" | grep -q '"schemaId"' || { echo "::error::--json lost its payload under AOT"; exit 1; }

          docker run --rm -v "$PWD/ws:/workspace" concordat/cli:ci lint --jsno >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::a usage error must exit 2, never 1"; exit 1; }

          docker run --rm -v "$PWD/ws:/workspace" concordat/cli:ci \
            check --registry http://127.0.0.1:9 >/dev/null 2>&1
          [ $? -eq 3 ] || { echo "::error::an unreachable registry must exit 3, never 1"; exit 1; }
