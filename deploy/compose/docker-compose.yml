# Concordat's dependencies for local work: a database and a broker.
#
#   docker compose up                        # Postgres and RabbitMQ only — the dev loop
#   docker compose --profile registry up     # ...and the registry itself, with its web UI
#
# The default leaves the registry out on purpose. You run it with `dotnet run`, so a change
# to the API is a restart rather than an image rebuild — which is the loop you actually want
# while writing code against the SDK. See docs/QUICKSTART.md.
#
# The `registry` profile is the other audience: somebody evaluating Concordat who has no .NET
# SDK and wants the promise ADR-008 makes — compose up, and try it. It runs the published
# images, so it needs no toolchain at all: the registry on :5062 and the web app on :5063.
# A new registry is closed until somebody claims it (ADR-047): open :5063 and the first screen is
# the setup, or see docs/RUNNING.md step 4.
#
# Every published port below binds 127.0.0.1 ONLY, not 0.0.0.0: this file is a local dev loop
# and an evaluation shortcut, not a hardened deployment. Postgres and RabbitMQ's default
# credentials (postgres/postgres, guest/guest) are only ever safe because nothing off this
# machine can reach them -- and the registry deserves the same binding for a sharper reason: until
# someone claims it, whoever reaches /v1/auth/bootstrap first owns it (ADR-047). Set
# CONCORDAT_BOOTSTRAP_TOKEN before exposing it, and see the opt-in below for the old open behaviour. If you run this compose file on a shared
# host or anything with a routable IP, override POSTGRES_PASSWORD, RABBITMQ_DEFAULT_USER and
# RABBITMQ_DEFAULT_PASS and reconsider whether loopback-only is still enough for your network.
services:
  postgres:
    # Pinned rather than floating, matching the version the test suite runs against. A
    # database that changes underneath you produces failures nobody can reproduce.
    image: postgres:17-alpine
    container_name: concordat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: concordat
    ports:
      # Deliberately not 5432. A developer machine very often already has a Postgres on the
      # default port — this one did — and "port is already allocated" is a discouraging first
      # thing to meet in a quickstart. The container still listens on 5432 internally.
      #
      # 127.0.0.1, not 0.0.0.0: the containers reach each other over the compose network
      # without this port published at all. Publishing it is purely for a developer's own
      # `psql`/GUI client on the same machine, and binding it to every interface would hand
      # the default password to anyone who can reach this host.
      - "127.0.0.1:55432:5432"
    healthcheck:
      # The migrator and the API both fail unhelpfully against a database that is listening
      # but not yet ready, so readiness is checked rather than assumed.
      test: ["CMD-SHELL", "pg_isready -U postgres -d concordat"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - concordat-postgres:/var/lib/postgresql/data

  rabbitmq:
    # The management image, so http://localhost:15672 shows you what the middleware did —
    # including anything routed to concordat.quarantine, which is the thing you will most
    # want to look at when a message does not arrive.
    image: rabbitmq:4.1-management
    container_name: concordat-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      # 127.0.0.1, not 0.0.0.0 -- see the top of this file. The official image only refuses
      # 'guest' logins from remote hosts when it thinks it IS remote; a published port on every
      # interface defeats that, and 'guest' is otherwise a byword for "already compromised".
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20

  # ---- profile: registry -------------------------------------------------------------
  #
  # Migrations run as their own service and the API waits for it to exit cleanly. The API
  # deliberately does not migrate on startup (M1.5) — every replica would race, and a failed
  # migration would take the app down instead of failing a step somebody is watching.
  migrate:
    profiles: ['registry']
    image: ${CONCORDAT_IMAGE:-ghcr.io/rafaeljcamara/concordat-api:latest}
    container_name: concordat-migrate
    entrypoint: ['dotnet', 'Concordat.Migrator.dll']
    environment:
      ConnectionStrings__Concordat: 'Host=postgres;Database=concordat;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}'
    depends_on:
      postgres:
        condition: service_healthy

  registry:
    profiles: ['registry']
    # The same image as `migrate`, and that is deliberate: a migrator from a different build
    # than the API is how a deployment ends up with a schema the code does not expect.
    image: ${CONCORDAT_IMAGE:-ghcr.io/rafaeljcamara/concordat-api:latest}
    container_name: concordat-api
    environment:
      ConnectionStrings__Concordat: 'Host=postgres;Database=concordat;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}'
      Concordat__Profile: 'SelfHosted'
      Concordat__Authentication__BootstrapToken: '${CONCORDAT_BOOTSTRAP_TOKEN:-}'
      # Off, which is the default and is written here so it can be found: an unclaimed registry answers
      # nobody (ADR-047). Set to 'true' to evaluate with no accounts, on a machine only you can reach;
      # it applies until the first account exists and logs a warning on a loop while it does.
      Concordat__Authentication__AllowAnonymousUntilClaimed: '${CONCORDAT_ALLOW_ANONYMOUS_UNTIL_CLAIMED:-false}'
    ports:
      # 127.0.0.1, not 0.0.0.0 -- see the top of this file. Until it is claimed, the first thing on the
      # network to POST /v1/auth/bootstrap owns the registry, so a routable port here needs a bootstrap
      # token first.
      - "127.0.0.1:5062:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # curl, not wget: the aspnet runtime image has neither by default, and this check called
      # wget for long enough that the registry reported unhealthy while answering every request.
      # The image installs curl for exactly this (docker/api.Dockerfile).
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/health/ready >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  # The web app: the same Angular bundle every deployment gets, behind nginx.
  #
  # nginx forwards /v1 and /health to the registry, so the browser only ever talks to this one
  # origin — which is why there is no CORS to configure, the session cookie is first-party, and
  # nothing in the page's Content-Security-Policy has to name anybody else. Where the registry is
  # (CONCORDAT_API_UPSTREAM) and what the page is told about it (CONCORDAT_API_BASE_URL and
  # friends) are environment variables read when the container starts, not part of the image: see
  # docker/web.Dockerfile.
  web:
    profiles: ['registry']
    image: ${CONCORDAT_WEB_IMAGE:-ghcr.io/rafaeljcamara/concordat-web:latest}
    container_name: concordat-web
    environment:
      CONCORDAT_API_UPSTREAM: 'http://registry:8080'
    ports:
      # 127.0.0.1, not 0.0.0.0 -- see the top of this file, and for the same reason as the
      # registry's own port: this serves a console for an instance that, until somebody claims
      # it (ADR-008), answers every request as an owner. A routable port here is a routable
      # sign-in page for that instance.
      - "127.0.0.1:5063:8080"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      # wget, which the alpine image has and curl, which it does not. /healthz is answered by
      # nginx itself: it says this container is serving, and leaves "is the registry up" to the
      # registry's own check, so the UI does not report itself broken whenever the API restarts.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  concordat-postgres:
